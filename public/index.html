<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>File Manager</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <h1>File Manager</h1>
  </header>
  <main>
    <nav id="breadcrumbs" class="breadcrumbs" aria-label="Folder path"></nav>

    <div class="toolbar">
      <form id="new-folder-form" class="new-folder">
        <label class="visually-hidden" for="new-folder-name">New folder name</label>
        <input id="new-folder-name" name="name" placeholder="New folder name" required maxlength="255" autocomplete="off">
        <button type="submit">Create folder</button>
      </form>
      <label class="button upload">
        Upload files
        <input id="upload-input" class="visually-hidden" type="file" multiple>
      </label>
      <label class="sort">
        <span>Sort</span>
        <select id="sort">
          <option value="name-asc">Name A–Z</option>
          <option value="name-desc">Name Z–A</option>
          <option value="modified-desc">Newest first</option>
          <option value="modified-asc">Oldest first</option>
          <option value="size-desc">Largest first</option>
          <option value="size-asc">Smallest first</option>
        </select>
      </label>
    </div>

    <p id="status" class="status" role="status" aria-live="polite"></p>
    <ul id="uploads" class="uploads" aria-label="Uploads"></ul>
    <ul id="listing" class="listing"></ul>
  </main>

  <dialog id="preview" class="preview" aria-labelledby="preview-title">
    <div class="preview-bar">
      <h2 id="preview-title" class="preview-title"></h2>
      <a id="preview-download" class="button download">Download</a>
      <button id="preview-close" type="button">Close</button>
    </div>
    <p id="preview-message" class="preview-message" role="status" aria-live="polite"></p>
    <div id="preview-body" class="preview-body"></div>
  </dialog>
</body>
</html>
